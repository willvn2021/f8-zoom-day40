<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redux Core Counter</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="counter-container">
            <h1 class="counter-title">Redux Counter</h1>

            <!-- Hiển thị giá trị -->
            <div id="counter-value">0</div>

            <!-- Control Button -->
            <div class="button-group">
                <button id="decrease" class="btn">- Decrease</button>
                <button id="increase" class="btn">+ Increase</button>
            </div>

            <!-- Button Reset + Unsubscribe -->
            <div class="button-group">
                <button id="reset" class="btn">Reset</button>
                <button id="unsubscribe" class="btn">Unsubscribe</button>
            </div>
        </div>

        <!-- Nhúng Redux từ CDN -->
        <!-- <script src="https://cdn.jsdelivr.net/npm/redux@4.2.1/dist/redux.js"></script> -->

        <!-- Redux My Core -->
        <script>
            const Redux = {
                __DO_NOT_USE__ActionTypes: {
                    type: "@@F8-redux/INIT.a.b.c",
                },
                createStore(reducer, initState) {
                    let state = reducer(
                        initState,
                        this.__DO_NOT_USE__ActionTypes
                    );

                    const listeners = [];

                    return {
                        getState() {
                            return state;
                        },
                        dispatch(action) {
                            state = reducer(state, action);
                            listeners.forEach((listener) => listener());
                        },
                        subscribe(listener) {
                            if (typeof listener === "function") {
                                listeners.push(listener);
                            }

                            return () => {
                                const index = listeners.indexOf(listener);
                                listeners.splice(index, 1);
                            };
                        },
                    };
                },
            };
        </script>

        <!-- My Redux -->
        <script src="./counter.js"></script>
    </body>
</html>
